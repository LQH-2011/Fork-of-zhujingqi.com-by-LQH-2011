<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TheStar_Blue - 管理后台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f5f7fa;
  color: #1a2a3a;
  min-height: 100vh;
  overflow-y: auto;
}

/* ===== Login ===== */
.login-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.login-box {
  background: #fff;
  padding: 40px 36px;
  border-radius: 20px;
  border: 1px solid #e0e4e8;
  width: 360px;
  max-width: 90vw;
  box-shadow: 0 8px 32px rgba(0,0,0,0.08);
}
.login-box h2 { text-align: center; margin-bottom: 4px; font-size: 1.3em; }
.login-box h2 span { color: #2563eb; }
.login-box .sub { text-align: center; color: #8a9aaa; font-size: 0.85em; margin-bottom: 24px; }
.login-box input {
  width: 100%; padding: 10px 14px;
  background: #f5f7fa; border: 1px solid #d0d8e0;
  border-radius: 20px; font-size: 15px; outline: none;
}
.login-box input:focus { border-color: #2563eb; }
.login-box .error { color: #dc2626; font-size: 0.88em; text-align: center; margin-top: 10px; display: none; }
.login-box button {
  width: 100%; margin-top: 16px; padding: 10px;
  background: #2563eb; border: none; border-radius: 20px;
  color: #fff; font-size: 15px; font-weight: 500; cursor: pointer;
}
.login-box button:hover { background: #3b82f6; }

/* ===== Admin ===== */
.admin { display: none; max-width: 960px; margin: 0 auto; padding: 24px 20px 100px; }
.admin.show { display: block; }

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 16px;
  border-bottom: 1px solid #e0e4e8;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}
.top h1 { font-size: 1.2em; font-weight: 600; }
.top .meta { color: #8a9aaa; font-size: 0.82em; margin-top: 2px; }

/* ===== Tabs ===== */
.tabs {
  display: flex;
  gap: 2px;
  margin-bottom: 16px;
  background: #e8ecf0;
  border-radius: 20px;
  padding: 3px;
}
.tabs button {
  flex: 1;
  padding: 8px 16px;
  border: none;
  border-radius: 18px;
  background: transparent;
  color: #5a6a7a;
  font-size: 0.88em;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}
.tabs button.active {
  background: #fff;
  color: #1a2a3a;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.tabs button:hover:not(.active) { color: #1a2a3a; }

/* ===== Panels ===== */
.panel { display: none; }
.panel.open { display: block; }

/* ===== Buttons ===== */
.btn {
  padding: 7px 16px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: background 0.15s, opacity 0.15s;
}
.btn:active { opacity: 0.8; }
.btn-pri { background: #2563eb; color: #fff; }
.btn-pri:hover { background: #3b82f6; }
.btn-dan { background: #dc2626; color: #fff; }
.btn-dan:hover { background: #ef4444; }
.btn-sec {
  background: transparent; color: #4a5a6a;
  border: 1px solid #d0d8e0; padding: 5px 12px;
}
.btn-sec:hover { background: #f0f2f5; }
.btn-sm { padding: 4px 10px; font-size: 12px; }

/* ===== Table ===== */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #e8ecf0; }
th { color: #8a9aaa; font-weight: 500; font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.5px; }
td { vertical-align: middle; }
tr.disabled td { opacity: 0.3; }
tr:last-child td { border-bottom: none; }

.thumb { width: 36px; height: 36px; object-fit: cover; border-radius: 20px; display: block; background: #f0f2f5; }
.no-thumb {
  width: 36px; height: 36px; border-radius: 20px;
  background: #f0f2f5; display: flex; align-items: center; justify-content: center;
  color: #c0c8d0; font-size: 16px;
}
.actions { display: flex; gap: 4px; }

.status-badge {
  display: inline-block; padding: 2px 8px; border-radius: 20px;
  font-size: 0.72em; font-weight: 500; cursor: pointer; user-select: none;
}
.status-badge.on { background: rgba(37,99,235,0.1); color: #2563eb; }
.status-badge.off { background: rgba(220,38,38,0.08); color: #dc2626; }

.empty-list { text-align: center; padding: 30px 20px; color: #8a9aaa; font-size: 0.88em; }

/* ===== Form ===== */
.form-card {
  background: #fff; border: 1px solid #e0e4e8;
  border-radius: 20px; padding: 20px; margin-bottom: 16px;
  display: none; box-shadow: 0 1px 6px rgba(0,0,0,0.03);
}
.form-card.open { display: block; }
.form-card h3 { font-size: 1em; font-weight: 600; margin-bottom: 14px; }
.form-row { margin-bottom: 12px; }
.form-row label { display: block; color: #5a6a7a; font-size: 0.82em; margin-bottom: 3px; }
.form-row input, .form-row textarea {
  width: 100%; padding: 7px 12px;
  background: #f5f7fa; border: 1px solid #d0d8e0;
  border-radius: 20px; font-size: 13px; outline: none;
}
.form-row textarea { resize: vertical; min-height: 50px; }
.form-row input:focus, .form-row textarea:focus { border-color: #2563eb; }
.form-row .checkbox-label {
  display: inline-flex; align-items: center; gap: 6px;
  color: #1a2a3a; font-size: 0.88em; cursor: pointer;
}
.form-row input[type="checkbox"] { width: auto; accent-color: #2563eb; }
.form-actions { display: flex; gap: 8px; margin-top: 4px; }
.form-actions .btn-pri { min-width: 80px; }

/* ===== About Editor ===== */
.editor-toolbar {
  display: flex; gap: 2px; padding: 5px 8px;
  background: #f5f7fa; border: 1px solid #d0d8e0;
  border-radius: 20px 20px 0 0; border-bottom: none; flex-wrap: wrap;
}
.editor-toolbar button {
  width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
  background: none; border: none; border-radius: 10px; cursor: pointer;
  color: #4a5a6a; font-size: 14px; font-weight: 500; font-family: inherit;
}
.editor-toolbar button:hover { background: #e0e4e8; }
.editor-toolbar button:active { background: #d0d8e0; }
.editor-toolbar .label-btn { font-size: 12px; width: auto; padding: 0 8px; font-weight: 600; }
.editor-toolbar .sep { width: 1px; background: #d0d8e0; margin: 3px 3px; }
.editor-area {
  min-height: 200px; max-height: 350px; overflow-y: auto;
  padding: 12px 14px; border: 1px solid #d0d8e0;
  border-radius: 0 0 20px 20px; background: #fff;
  color: #1a2a3a; font-size: 14px; line-height: 1.7; outline: none; font-family: inherit;
}
.editor-area:focus { border-color: #2563eb; }
.editor-area h1 { font-size: 1.5em; font-weight: 700; margin: 16px 0 8px; }
.editor-area h2 { font-size: 1.2em; font-weight: 600; margin: 12px 0 6px; }
.editor-area h3 { font-size: 1.05em; font-weight: 600; margin: 10px 0 5px; }
.editor-area p { margin-bottom: 8px; }
.editor-area ul, .editor-area ol { margin: 4px 0 8px 18px; }
.editor-area li { margin-bottom: 2px; }
.editor-area blockquote { border-left: 3px solid #2563eb; padding-left: 12px; margin: 8px 0; color: #5a6a7a; }
.editor-area hr { border: none; border-top: 1px solid #d0d8e0; margin: 12px 0; }
.editor-area a { color: #2563eb; }
.editor-area img { max-width: 100%; border-radius: 20px; margin: 8px 0; }

/* ===== Save Bar ===== */
.save-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #fff; border-top: 1px solid #e0e4e8;
  padding: 12px 20px; display: flex;
  justify-content: space-between; align-items: center;
  z-index: 500; gap: 10px;
  box-shadow: 0 -2px 12px rgba(0,0,0,0.04);
}
.save-bar .info { color: #8a9aaa; font-size: 0.85em; }
.save-bar .info.dirty { color: #b45309; }
.save-bar .btn-pri { min-width: 120px; padding: 9px 20px; font-size: 14px; }

/* ===== Confirm ===== */
.confirm-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.3);
  display: none; align-items: center; justify-content: center;
  z-index: 2000; padding: 24px; backdrop-filter: blur(2px);
}
.confirm-overlay.open { display: flex; }
.confirm-box {
  background: #fff; border-radius: 20px;
  padding: 28px 24px 20px; max-width: 360px; width: 100%;
  box-shadow: 0 12px 48px rgba(0,0,0,0.12);
  animation: confirmIn 0.2s ease;
}
@keyframes confirmIn {
  from { opacity: 0; transform: scale(0.92) translateY(12px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.confirm-box p { font-size: 1em; text-align: center; margin-bottom: 20px; }
.confirm-box .actions { display: flex; gap: 10px; justify-content: center; }
.confirm-box .actions button {
  min-width: 90px; padding: 9px 20px; border-radius: 20px;
  border: none; font-size: 14px; font-weight: 500; cursor: pointer;
}
.confirm-box .btn-cancel { background: #f0f2f5; color: #5a6a7a; }
.confirm-box .btn-cancel:hover { background: #e0e4e8; }
.confirm-box .btn-confirm { background: #dc2626; color: #fff; }
.confirm-box .btn-confirm:hover { background: #ef4444; }

/* ===== Toast ===== */
.toast {
  position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
  background: #2563eb; color: #fff; padding: 8px 20px;
  border-radius: 20px; font-size: 0.88em; z-index: 999;
  display: none; white-space: nowrap; box-shadow: 0 4px 20px rgba(37,99,235,0.2);
}
.toast.err { background: #dc2626; }
.toast.show { display: block; animation: toastIn 0.25s ease; }
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(12px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

@media (max-width: 640px) {
  .admin { padding: 16px 12px 120px; }
  .tabs button { font-size: 0.82em; padding: 6px 10px; }
  .form-card { padding: 14px; }
  th, td { padding: 6px 6px; font-size: 0.82em; }
  .save-bar { flex-direction: column; align-items: stretch; padding: 10px 16px; }
  .save-bar .btn-pri { width: 100%; text-align: center; }
}
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2><span>TheStar</span>_Blue</h2>
    <div class="sub">管理后台</div>
    <form id="loginForm" autocomplete="off">
      <input type="password" id="pwInput" placeholder="请输入管理密码" autofocus>
      <div class="error" id="loginError">密码错误</div>
      <button type="submit">登录</button>
    </form>
  </div>
</div>

<div class="admin" id="adminPanel">
  <div class="top">
    <div>
      <h1>TheStar_Blue</h1>
      <div class="meta" id="metaInfo">加载中...</div>
    </div>
  </div>

  <div class="tabs">
    <button class="active" onclick="switchTab('shop')">商品</button>
    <button onclick="switchTab('roster')">角色</button>
    <button onclick="switchTab('about')">关于</button>
  </div>

  <div class="panel open" id="panelShop">
    <div style="margin-bottom:12px">
      <button class="btn btn-pri" onclick="openForm('shop')">+ 添加商品</button>
    </div>
    <div class="table-wrap">
      <table><thead><tr>
        <th style="width:44px">图</th><th>名称</th><th>价格</th><th style="width:80px">状态</th><th style="width:100px">操作</th>
      </tr></thead><tbody id="shopBody"></tbody></table>
    </div>
    <div class="empty-list" id="shopEmpty">暂无商品</div>
  </div>

  <div class="panel" id="panelRoster">
    <div style="margin-bottom:12px">
      <button class="btn btn-pri" onclick="openForm('roster')">+ 添加角色</button>
    </div>
    <div class="table-wrap">
      <table><thead><tr>
        <th style="width:44px">图</th><th>名称</th><th style="width:80px">状态</th><th style="width:100px">操作</th>
      </tr></thead><tbody id="rosterBody"></tbody></table>
    </div>
    <div class="empty-list" id="rosterEmpty">暂无角色</div>
  </div>

  <div class="panel" id="panelAbout">
    <div class="editor-toolbar">
      <button onclick="execEdit('bold')"><b>B</b></button>
      <button onclick="execEdit('italic')"><i>I</i></button>
      <button onclick="execEdit('underline')"><u>U</u></button>
      <div class="sep"></div>
      <button class="label-btn" onclick="execEdit('formatBlock','h1')">H1</button>
      <button class="label-btn" onclick="execEdit('formatBlock','h2')">H2</button>
      <button class="label-btn" onclick="execEdit('formatBlock','h3')">H3</button>
      <div class="sep"></div>
      <button onclick="execEdit('insertUnorderedList')">&#8226;</button>
      <button onclick="execEdit('insertOrderedList')">1.</button>
      <div class="sep"></div>
      <button onclick="execEdit('insertHorizontalRule')">&mdash;</button>
      <button onclick="execEdit('removeFormat')">&times;</button>
    </div>
    <div class="editor-area" id="aboutEditor" contenteditable="true"></div>
  </div>

  <div class="form-card" id="formCard">
    <h3 id="formTitle">添加</h3>
    <input type="hidden" id="editId">
    <input type="hidden" id="editType" value="shop">
    <div class="form-row">
      <label>名称 *</label>
      <input type="text" id="fName" placeholder="">
    </div>
    <div class="form-row">
      <label>描述</label>
      <textarea id="fDesc" placeholder="描述..."></textarea>
    </div>
    <div class="form-row" id="priceRow">
      <label>价格</label>
      <input type="text" id="fPrice" placeholder="￥10">
    </div>
    <div class="form-row">
      <label>图片 URL</label>
      <input type="url" id="fImage" placeholder="https://...">
    </div>
    <div class="form-row">
      <label class="checkbox-label">
        <input type="checkbox" id="fEnabled" checked> 已上架
      </label>
    </div>
    <div class="form-actions">
      <button class="btn btn-pri" onclick="saveProduct()">保存</button>
      <button class="btn btn-sec" onclick="closeForm()">取消</button>
    </div>
  </div>

  <div class="save-bar">
    <div class="info" id="saveInfo">已保存！</div>
    <button class="btn btn-pri" id="saveBtn" onclick="saveToServer()">保存所有更改</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmMsg"></p>
    <div class="actions">
      <button class="btn-cancel" id="confirmCancel">取消</button>
      <button class="btn-confirm" id="confirmOk">确定</button>
    </div>
  </div>
</div>

<script>
var TEXTDB_KEY = 'TheStarBlue_ProdData';
var ADMIN_PW_HASH = '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918';
var shopProducts = [];
var rosterProducts = [];
var dirty = false;
var aboutDirty = false;

(function() {
  if (sessionStorage.getItem('tsb_auth') === '1') {
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('adminPanel').classList.add('show');
    loadData();
  }
})();

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var pw = document.getElementById('pwInput').value;
  var hash = await sha256(pw);
  if (hash === ADMIN_PW_HASH) {
    sessionStorage.setItem('tsb_auth', '1');
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('adminPanel').classList.add('show');
    loadData();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
});

function sha256(str) {
  if (typeof crypto !== 'undefined' && crypto.subtle && crypto.subtle.digest && typeof TextEncoder !== 'undefined') {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))
      .then(function(buf) {
        var bytes = new Uint8Array(buf), hex = '';
        for (var i = 0; i < bytes.length; i++) {
          hex += ('0' + bytes[i].toString(16)).slice(-2);
        }
        return hex;
      })
      .catch(function() { return sha256js(str); });
  }
  return sha256js(str);
}

function sha256js(ascii) {
  function rightRotate(value, amount) {
    return (value >>> amount) | (value << (32 - amount));
  }
  var maxWord = Math.pow(2, 32);
  var result = '';
  var words = [];
  var asciiBitLength = ascii.length * 8;
  var hash = [];
  var k = [];
  var primeCounter = 0;
  var isComposite = {};
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (var i = 0; i < 313; i += candidate) {
        isComposite[i] = candidate;
      }
      hash[primeCounter] = (Math.pow(candidate, .5) * maxWord) | 0;
      k[primeCounter++] = (Math.pow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (var i = 0; i < ascii.length; i++) {
    var j = ascii.charCodeAt(i);
    if (j >> 8) return '';
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = (asciiBitLength / maxWord) | 0;
  words[words.length] = asciiBitLength;
  for (var j = 0; j < words.length;) {
    var w = words.slice(j, j += 16);
    var oldHash = hash;
    hash = hash.slice(0, 8);
    for (var i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2];
      var a = hash[0], e = hash[4];
      var temp1 = hash[7]
        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
        + ((e & hash[5]) ^ ((~e) & hash[6]))
        + k[i]
        + (w[i] = (i < 16) ? w[i] : (
            w[i - 16]
            + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
            + w[i - 7]
            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
          ) | 0);
      var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
        + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (var i = 0; i < 8; i++) {
      hash[i] = (hash[i] + oldHash[i]) | 0;
    }
  }
  for (var i = 0; i < 8; i++) {
    for (var j = 3; j + 1; j--) {
      var b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? 0 : '') + b.toString(16);
    }
  }
  return result;
}

function switchTab(name) {
  document.querySelectorAll('.tabs button').forEach(function(b) { b.classList.remove('active'); });
  document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('open'); });
  document.querySelector('.tabs button[onclick*="' + name + '"]').classList.add('active');
  document.getElementById('panel' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('open');
  closeForm();
}

function loadData() {
  document.getElementById('metaInfo').textContent = '读取中...';
  fetch('https://textdb.online/' + TEXTDB_KEY)
    .then(function(r) { return r.text(); })
    .then(function(text) {
      if (text) {
        try {
          var data = JSON.parse(text);
          shopProducts = data.shopProducts || [];
          rosterProducts = data.rosterProducts || [];
          var ae = document.getElementById('aboutEditor');
          if (ae && data.aboutContent) ae.innerHTML = data.aboutContent;
        } catch(e) { shopProducts = []; rosterProducts = []; }
      } else { shopProducts = []; rosterProducts = []; }
      dirty = false; aboutDirty = false;
      renderAll(); updateSaveInfo();
    })
    .catch(function() {
      shopProducts = []; rosterProducts = [];
      renderAll(); updateSaveInfo();
      toast('读取失败，请检查网络', true);
    });
}

function saveToServer() {
  var btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '保存中...';
  var ae = document.getElementById('aboutEditor');
  var json = JSON.stringify({
    shopProducts: shopProducts,
    rosterProducts: rosterProducts,
    aboutContent: ae ? ae.innerHTML : ''
  });
  fetch('https://textdb.online/update/?key=' + encodeURIComponent(TEXTDB_KEY) + '&value=' + encodeURIComponent(json))
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res.status === 1) { dirty = false; aboutDirty = false; updateSaveInfo(); toast('保存成功！'); }
      else { toast('保存失败！', true); }
    })
    .catch(function() { toast('网络错误！', true); })
    .finally(function() { btn.disabled = false; btn.textContent = '保存所有更改'; });
}

function openForm(type, data) {
  document.getElementById('formCard').classList.add('open');
  document.getElementById('editType').value = type;
  var isShop = type === 'shop';
  document.getElementById('formTitle').textContent = data ? (isShop ? '编辑商品' : '编辑角色') : (isShop ? '添加商品' : '添加角色');
  document.getElementById('priceRow').style.display = isShop ? 'block' : 'none';
  document.getElementById('editId').value = data ? data.id : '';
  document.getElementById('fName').value = data ? (data.name || '') : '';
  document.getElementById('fDesc').value = data ? (data.description || '') : '';
  document.getElementById('fPrice').value = (isShop && data) ? (data.price || '') : '';
  document.getElementById('fImage').value = data ? (data.image || '') : '';
  document.getElementById('fEnabled').checked = data ? (data.enabled !== false) : true;
  document.getElementById('fName').focus();
}

function closeForm() { document.getElementById('formCard').classList.remove('open'); }

function saveProduct() {
  var name = document.getElementById('fName').value.trim();
  if (!name) { toast('请输入名称', true); return; }
  var type = document.getElementById('editType').value;
  var list = type === 'shop' ? shopProducts : rosterProducts;
  var editId = document.getElementById('editId').value;
  var product = {
    name: name,
    description: document.getElementById('fDesc').value.trim(),
    price: type === 'shop' ? document.getElementById('fPrice').value.trim() : '',
    image: document.getElementById('fImage').value.trim(),
    enabled: document.getElementById('fEnabled').checked
  };
  if (editId) {
    var idx = list.findIndex(function(p) { return p.id == editId; });
    if (idx !== -1) { for (var k in product) list[idx][k] = product[k]; }
    toast('已更新');
  } else {
    product.id = Date.now() + Math.floor(Math.random() * 1000);
    list.push(product);
    toast('已添加，记得保存！');
  }
  closeForm(); dirty = true; renderAll(); updateSaveInfo();
}

function editProduct(type, id) {
  var list = type === 'shop' ? shopProducts : rosterProducts;
  var p = list.find(function(x) { return x.id === id; });
  if (p) openForm(type, p);
}

async function deleteProduct(type, id) {
  if (!await showConfirm('确定删除？')) return;
  var list = type === 'shop' ? shopProducts : rosterProducts;
  var idx = list.findIndex(function(p) { return p.id === id; });
  if (idx !== -1) list.splice(idx, 1);
  dirty = true; renderAll(); updateSaveInfo(); toast('已删除');
}

function toggleProduct(type, id) {
  var list = type === 'shop' ? shopProducts : rosterProducts;
  var p = list.find(function(x) { return x.id === id; });
  if (p) { p.enabled = !p.enabled; dirty = true; renderAll(); updateSaveInfo(); }
}

function renderAll() {
  renderTable('shop', shopProducts, 'shopBody', 'shopEmpty');
  renderTable('roster', rosterProducts, 'rosterBody', 'rosterEmpty');
  document.getElementById('metaInfo').textContent = '商品: ' + shopProducts.length + '  |  角色: ' + rosterProducts.length;
}

function renderTable(type, list, bodyId, emptyId) {
  var tbody = document.getElementById(bodyId);
  var empty = document.getElementById(emptyId);
  if (list.length === 0) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  var isShop = type === 'shop';
  tbody.innerHTML = list.map(function(p) {
    var img = p.image
      ? '<img class="thumb" src="' + p.image.replace(/"/g,'&quot;') + '" alt="" onerror="this.style.display=\'none\'">'
      : '<div class="no-thumb">✦</div>';
    var st = '<span class="status-badge ' + (p.enabled !== false ? 'on' : 'off') + '" onclick="toggleProduct(\'' + type + '\',' + p.id + ')">' + (p.enabled !== false ? '上架' : '下架') + '</span>';
    var price = isShop ? '<td>' + (p.price ? esc(p.price) : '-') + '</td>' : '';
    return '<tr class="' + (p.enabled === false ? 'disabled' : '') + '">' +
      '<td>' + img + '</td><td>' + esc(p.name) + '</td>' + price +
      '<td>' + st + '</td>' +
      '<td><div class="actions"><button class="btn btn-sec btn-sm" onclick="editProduct(\'' + type + '\',' + p.id + ')">编辑</button>' +
      '<button class="btn btn-dan btn-sm" onclick="deleteProduct(\'' + type + '\',' + p.id + ')">删除</button></div></td></tr>';
  }).join('');
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showConfirm(msg) {
  return new Promise(function(resolve) {
    var ov = document.getElementById('confirmOverlay');
    document.getElementById('confirmMsg').textContent = msg;
    ov.classList.add('open');
    function done(r) { ov.classList.remove('open'); resolve(r); }
    document.getElementById('confirmOk').onclick = function() { done(true); };
    document.getElementById('confirmCancel').onclick = function() { done(false); };
  });
}

function execEdit(cmd, val) {
  document.execCommand(cmd, false, val || null);
  document.getElementById('aboutEditor').focus();
}

document.addEventListener('DOMContentLoaded', function() {
  var ae = document.getElementById('aboutEditor');
  if (ae) ae.addEventListener('input', function() { aboutDirty = true; updateSaveInfo(); });
});

function updateSaveInfo() {
  var el = document.getElementById('saveInfo');
  el.textContent = (dirty || aboutDirty) ? '有未保存的更改' : '已保存';
  el.className = 'info' + ((dirty || aboutDirty) ? ' dirty' : '');
}

function toast(msg, isErr) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._t); t._t = setTimeout(function() { t.classList.remove('show'); }, 2500);
}
</script>
</body>
</html>
