<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>TheStar_Blue - 评论区</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html,
			body {
				height: 100%;
				overflow: hidden;
			}

			:root {
				--bg: #000;
				--text: #e8eaed;
				--header-text: rgba(255, 255, 255, 0.35);
				--header-accent: #64b5f6;
				--link-color: rgba(255, 255, 255, 0.35);
				--link-hover: #64b5f6;
				--toggle-color: rgba(255, 255, 255, 0.2);
				--toggle-hover: rgba(255, 255, 255, 0.35);
				--content-max-w: 640px;
				--panel-bg: rgba(255, 255, 255, 0.03);
				--panel-border: rgba(255, 255, 255, 0.08);
				--input-bg: rgba(255, 255, 255, 0.04);
				--btn-text: #0b1a26;
			}

			body.light {
				--bg: #eef1f5;
				--text: #1a2a3a;
				--header-text: #8a9aaa;
				--header-accent: #2563eb;
				--link-color: #8a9aaa;
				--link-hover: #2563eb;
				--toggle-color: rgba(0, 0, 0, 0.2);
				--toggle-hover: rgba(0, 0, 0, 0.35);
				--panel-bg: rgba(255, 255, 255, 0.55);
				--panel-border: rgba(0, 0, 0, 0.06);
				--input-bg: rgba(255, 255, 255, 0.8);
				--btn-text: #fff;
			}

			body {
				background: var(--bg);
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				color: var(--text);
				transition: background 0.4s ease, color 0.4s ease;
				display: flex;
				flex-direction: column;
				height: 100vh;
			}

			.theme-btn {
				position: fixed;
				top: 24px;
				right: 24px;
				z-index: 1000;
				background: none;
				border: none;
				cursor: pointer;
				padding: 8px;
				border-radius: 50%;
				color: var(--toggle-color);
				transition: color 0.3s, transform 0.2s;
				line-height: 0;
			}

			.theme-btn:hover {
				color: var(--toggle-hover);
				transform: scale(1.1);
			}

			.theme-btn:active {
				transform: scale(0.9);
			}

			.theme-btn svg {
				width: 28px;
				height: 28px;
				display: block;
			}

			.header {
				text-align: center;
				padding: 36px 20px 10px;
				position: relative;
				z-index: 100;
				flex-shrink: 0;
			}

			.header a {
				display: inline-block;
				color: var(--link-color);
				text-decoration: none;
				font-size: 0.88em;
				margin-bottom: 10px;
				transition: color 0.2s;
			}

			.header a:hover {
				color: var(--link-hover);
			}

			.header h1 {
				font-size: 2em;
				font-weight: 700;
				letter-spacing: 2px;
			}

			.header h1 span {
				color: var(--header-accent);
			}

			.scroll-wrap {
				flex: 1;
				overflow-y: auto;
				-webkit-overflow-scrolling: touch;
				padding: 20px 24px 60px;
			}

			.scroll-wrap::-webkit-scrollbar {
				width: 4px;
			}

			.scroll-wrap::-webkit-scrollbar-thumb {
				background: rgba(128, 128, 128, 0.15);
				border-radius: 4px;
			}

			.content {
				max-width: var(--content-max-w);
				margin: 0 auto;
				font-size: 0.95em;
				line-height: 1.8;
			}

			.page-title {
				font-size: 1.4em;
				font-weight: 600;
				margin-bottom: 18px;
				letter-spacing: -0.3px;
			}

			/* ===== Comment Form ===== */
			.form-card {
				background: var(--panel-bg);
				border: 1px solid var(--panel-border);
				border-radius: 20px;
				padding: 16px;
				margin-bottom: 28px;
				transition: background 0.4s, border-color 0.4s;
			}

			.form-card .name-row {
				display: flex;
				gap: 10px;
				margin-bottom: 10px;
			}

			.form-card input[type="text"],
			.form-card textarea {
				width: 100%;
				background: var(--input-bg);
				border: 1px solid var(--panel-border);
				border-radius: 12px;
				padding: 8px 12px;
				color: var(--text);
				font-size: 0.9em;
				font-family: inherit;
				outline: none;
				transition: border-color 0.2s, background 0.4s;
			}

			.form-card input[type="text"] {
				flex: 1;
			}

			.form-card textarea {
				min-height: 90px;
				resize: vertical;
				margin-bottom: 10px;
				line-height: 1.6;
			}

			.form-card input:focus,
			.form-card textarea:focus {
				border-color: var(--header-accent);
			}

			.form-card .meta-row {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 10px;
			}

			.form-card .char-count {
				color: var(--header-text);
				font-size: 0.75em;
			}

			.btn-send {
				background: var(--header-accent);
				border: none;
				color: var(--btn-text);
				padding: 8px 26px;
				border-radius: 20px;
				font-size: 0.88em;
				font-weight: 600;
				cursor: pointer;
				transition: opacity 0.2s, transform 0.1s;
				letter-spacing: 0.5px;
			}

			.btn-send:hover {
				opacity: 0.85;
			}

			.btn-send:active {
				transform: scale(0.96);
			}

			.btn-send:disabled {
				opacity: 0.45;
				cursor: not-allowed;
			}

			/* ===== Comment List ===== */
			.list-title {
				color: var(--header-text);
				font-size: 0.82em;
				margin-bottom: 12px;
				letter-spacing: 0.5px;
				transition: color 0.4s;
			}

			.comment {
				background: var(--panel-bg);
				border: 1px solid var(--panel-border);
				border-radius: 20px;
				padding: 14px 16px;
				margin-bottom: 12px;
				transition: background 0.4s, border-color 0.4s;
			}

			.comment .c-head {
				display: flex;
				justify-content: space-between;
				align-items: baseline;
				gap: 10px;
				margin-bottom: 5px;
			}

			.comment .c-head-right {
				display: flex;
				align-items: baseline;
				gap: 8px;
				flex-shrink: 0;
			}

			.comment .c-name {
				color: var(--header-accent);
				font-size: 0.88em;
				font-weight: 600;
			}

			.comment .c-time {
				color: var(--header-text);
				font-size: 0.72em;
			}

			.c-del {
				background: none;
				border: none;
				padding: 0;
				color: var(--header-text);
				font-size: 0.72em;
				cursor: pointer;
				font-family: inherit;
				transition: color 0.2s;
			}

			.c-del:hover {
				color: #dc2626;
			}

			/* ===== Confirm ===== */
			.confirm-overlay {
				position: fixed;
				inset: 0;
				background: rgba(0, 0, 0, 0.3);
				display: none;
				align-items: center;
				justify-content: center;
				z-index: 2000;
				padding: 24px;
				backdrop-filter: blur(2px);
				-webkit-backdrop-filter: blur(2px);
			}

			.confirm-overlay.open {
				display: flex;
			}

			.confirm-box {
				background: var(--panel-bg);
				border: 1px solid var(--panel-border);
				border-radius: 20px;
				padding: 28px 24px 20px;
				max-width: 360px;
				width: 100%;
				box-shadow: 0 12px 48px rgba(0, 0, 0, 0.35);
				animation: confirmIn 0.2s ease;
				transition: background 0.4s, border-color 0.4s;
			}

			@keyframes confirmIn {
				from { opacity: 0; transform: scale(0.92) translateY(12px); }
				to { opacity: 1; transform: scale(1) translateY(0); }
			}

			.confirm-box p {
				font-size: 1em;
				text-align: center;
				margin-bottom: 20px;
				color: var(--text);
				transition: color 0.4s;
			}

			.confirm-box .actions {
				display: flex;
				gap: 10px;
				justify-content: center;
			}

			.confirm-box .actions button {
				min-width: 90px;
				padding: 9px 20px;
				border-radius: 20px;
				border: none;
				font-size: 14px;
				font-weight: 500;
				cursor: pointer;
				font-family: inherit;
				transition: opacity 0.15s, background 0.2s;
			}

			.confirm-box .btn-cancel {
				background: var(--input-bg);
				color: var(--text);
				border: 1px solid var(--panel-border);
			}

			.confirm-box .btn-cancel:hover {
				opacity: 0.8;
			}

			.confirm-box .btn-confirm {
				background: #dc2626;
				color: #fff;
			}

			.confirm-box .btn-confirm:hover {
				background: #ef4444;
			}

			.comment .c-text {
				font-size: 0.92em;
				line-height: 1.7;
				word-break: break-word;
				white-space: pre-wrap;
			}

			.empty-list {
				text-align: center;
				color: var(--header-text);
				padding: 40px 20px;
				font-size: 0.9em;
				transition: color 0.4s;
			}

			.status-msg {
				text-align: center;
				color: var(--header-text);
				padding: 60px 20px;
				transition: color 0.4s;
			}

			.status-msg h2 {
				font-size: 1.2em;
				font-weight: 500;
				margin-bottom: 4px;
			}

			.status-msg p {
				font-size: 0.9em;
			}

			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}

			.spinner {
				display: inline-block;
				width: 24px;
				height: 24px;
				border: 2px solid rgba(128, 128, 128, 0.15);
				border-top-color: var(--header-accent);
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
				margin-bottom: 8px;
			}

			#page {
				animation: pageIn 0.35s cubic-bezier(0.22, 0.89, 0.35, 1) both;
				display: flex;
				flex-direction: column;
				height: 100vh;
			}

			@keyframes pageIn {
				from { opacity: 0; transform: translateY(12px); }
				to { opacity: 1; transform: translateY(0); }
			}

			#page.page-out {
				transition: opacity 0.18s ease, transform 0.18s ease;
				opacity: 0;
				transform: translateY(-8px);
			}

			.footer {
				flex-shrink: 0;
				text-align: center;
				padding: 16px 20px;
				color: var(--header-text);
				font-size: 0.75em;
				transition: color 0.4s;
			}

			.toast {
				position: fixed;
				bottom: 70px;
				left: 50%;
				transform: translateX(-50%);
				background: var(--header-accent);
				color: var(--btn-text);
				padding: 8px 20px;
				border-radius: 20px;
				font-size: 0.85em;
				z-index: 999;
				display: none;
				white-space: nowrap;
				box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
			}

			.toast.err {
				background: #dc2626;
				color: #fff;
			}

			.toast.show {
				display: block;
				animation: toastIn 0.25s ease;
			}

			@keyframes toastIn {
				from { opacity: 0; transform: translateX(-50%) translateY(12px); }
				to { opacity: 1; transform: translateX(-50%) translateY(0); }
			}

			@media (max-width: 640px) {
				.header {
					padding: 24px 16px 6px;
				}

				.header h1 {
					font-size: 1.5em;
				}

				.scroll-wrap {
					padding: 16px 16px 50px;
				}

				.theme-btn {
					top: 16px;
					right: 16px;
				}

				.theme-btn svg {
					width: 24px;
					height: 24px;
				}
			}
		</style>
	</head>
	<body>
		<div id="page">
			<button class="theme-btn" id="themeBtn" aria-label="切换主题">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
					stroke-linejoin="round">
					<circle cx="12" cy="12" r="5" />
					<path
						d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
				</svg>
			</button>
			<div class="header">
				<a href="index.html">← 返回首页</a>
				<h1><span>TheStar</span>_Blue</h1>
			</div>
			<div class="scroll-wrap" id="scrollWrap">
				<div class="status-msg" id="loading">
					<div class="spinner"></div>
					<p>加载中...</p>
				</div>
				<div class="content" id="content" style="display:none">
					<h2 class="page-title">评论区</h2>
					<div class="form-card">
						<div class="name-row">
							<input type="text" id="cName" maxlength="20" placeholder="昵称（可选）">
						</div>
						<textarea id="cContent" maxlength="500" placeholder="写下你的评论..." rows="3"></textarea>
						<div class="meta-row">
							<span class="char-count" id="charCount">0 / 500</span>
							<button class="btn-send" id="cSend">发表</button>
						</div>
					</div>
					<div class="list-title" id="listTitle"></div>
					<div id="commentList"></div>
				</div>
			</div>
			<div class="footer">&copy; TheStar_Blue</div>
		</div>
		<div class="toast" id="toast"></div>

		<div class="confirm-overlay" id="confirmOverlay">
			<div class="confirm-box">
				<p id="confirmMsg"></p>
				<div class="actions">
					<button class="btn-cancel" id="confirmCancel">取消</button>
					<button class="btn-confirm" id="confirmOk">确定</button>
				</div>
			</div>
		</div>

		<script>
			var COMMENTS_KEY = 'TheStarBlue_Comments_v1';
			var comments = [];
			var lastPost = 0;
			var COOLDOWN = 30000;

			(function() {
				var content = document.getElementById('content');
				var loading = document.getElementById('loading');
				fetch('https://textdb.online/' + COMMENTS_KEY)
					.then(function(r) { return r.text(); })
					.then(function(text) {
						if (text) {
							try { comments = JSON.parse(text) || []; } catch (e) { comments = []; }
						} else { comments = []; }
						if (!Array.isArray(comments)) comments = [];
						loading.style.display = 'none';
						content.style.display = 'block';
						renderComments();
					})
					.catch(function() {
						loading.innerHTML = '<h2>加载失败</h2><p>请刷新页面重试</p>';
					});
			})();

			function renderComments() {
				var list = document.getElementById('commentList');
				var title = document.getElementById('listTitle');
				title.textContent = comments.length > 0 ? '共 ' + comments.length + ' 条评论' : '';
				if (comments.length === 0) {
					list.innerHTML = '<div class="empty-list">还没有评论，来抢沙发～</div>';
					return;
				}
				var sorted = comments.slice().sort(function(a, b) { return (b.time || '').localeCompare(a.time || ''); });
				list.innerHTML = sorted.map(function(c) {
					var del = delToken(c) ? '<button class="c-del" onclick="deleteOwnComment(' + c.id + ')">删除</button>' : '';
					return '<div class="comment">' +
						'<div class="c-head"><span class="c-name">' + esc(c.name || '游客') + '</span>' +
						'<span class="c-head-right"><span class="c-time">' + esc(c.time || '') + '</span>' + del + '</span></div>' +
						'<div class="c-text">' + esc(c.content || '') + '</div>' +
						'</div>';
				}).join('');
			}

			function delToken(c) {
				var v = localStorage.getItem('tsb_del_' + c.id);
				if (!v) return null;
				if (Date.now() - parseInt(v, 10) > 600000) {
					localStorage.removeItem('tsb_del_' + c.id);
					return null;
				}
				return v;
			}

			async function deleteOwnComment(id) {
				if (!await showConfirm('确定删除这条评论？')) return;
				var idx = comments.findIndex(function(c) { return c.id === id; });
				if (idx === -1) return;
				comments.splice(idx, 1);
				localStorage.removeItem('tsb_del_' + id);
				renderComments();
				fetch('https://textdb.online/update/?key=' + encodeURIComponent(COMMENTS_KEY) + '&value=' + encodeURIComponent(JSON.stringify(comments)))
					.then(function(r) { return r.json(); })
					.then(function(res) {
						if (res.status === 1) { toast('已删除'); }
						else { toast('删除失败，请重试', true); }
					})
					.catch(function() { toast('网络错误，删除失败', true); });
			}

			document.getElementById('cSend').addEventListener('click', function() {
				var nameEl = document.getElementById('cName');
				var contentEl = document.getElementById('cContent');
				var content = contentEl.value.trim();
				if (!content) { toast('评论内容不能为空', true); contentEl.focus(); return; }
				var now = Date.now();
				if (lastPost && now - lastPost < COOLDOWN) {
					toast('发表太频繁，请稍后再试', true);
					return;
				}
				var comment = {
					id: now + Math.floor(Math.random() * 1000),
					name: (nameEl.value.trim() || '游客').slice(0, 20),
					content: content.slice(0, 500),
					time: formatTime(now)
				};
				comments.unshift(comment);
				localStorage.setItem('tsb_del_' + comment.id, String(now));
				renderComments();
				contentEl.value = '';
				updateCharCount();
				lastPost = now;
				saveComments(comment, 0);
			});

			document.getElementById('cContent').addEventListener('input', updateCharCount);

			function updateCharCount() {
				var len = document.getElementById('cContent').value.length;
				document.getElementById('charCount').textContent = len + ' / 500';
			}

			function saveComments(comment, attempt) {
				fetch('https://textdb.online/update/?key=' + encodeURIComponent(COMMENTS_KEY) + '&value=' + encodeURIComponent(JSON.stringify(comments)))
					.then(function(r) { return r.json(); })
					.then(function(res) {
						if (res.status === 1) { toast('发表成功！'); }
						else { throw new Error('save failed'); }
					})
					.catch(function() {
						if (attempt < 1) {
							fetch('https://textdb.online/' + COMMENTS_KEY)
								.then(function(r) { return r.text(); })
								.then(function(text) {
									var latest = [];
									if (text) {
										try { latest = JSON.parse(text) || []; } catch (e) {}
									}
									if (!Array.isArray(latest)) latest = [];
									var exists = latest.some(function(c) { return c.id === comment.id; });
									if (!exists) latest.unshift(comment);
									comments = latest;
									renderComments();
									return fetch('https://textdb.online/update/?key=' + encodeURIComponent(COMMENTS_KEY) + '&value=' + encodeURIComponent(JSON.stringify(latest)));
								})
								.then(function(r) { return r.json(); })
								.then(function(res) {
									if (res.status === 1) { toast('发表成功！'); }
									else { throw new Error('retry failed'); }
								})
								.catch(function() { failComment(comment); });
						} else {
							failComment(comment);
						}
					});
			}

			function failComment(comment) {
				var idx = comments.findIndex(function(c) { return c.id === comment.id; });
				if (idx !== -1) comments.splice(idx, 1);
				localStorage.removeItem('tsb_del_' + comment.id);
				renderComments();
				document.getElementById('cContent').value = comment.content;
				updateCharCount();
				toast('发表失败，请重试', true);
			}

			function showConfirm(msg) {
				return new Promise(function(resolve) {
					var ov = document.getElementById('confirmOverlay');
					document.getElementById('confirmMsg').textContent = msg;
					ov.classList.add('open');
					function done(r) {
						ov.classList.remove('open');
						resolve(r);
					}
					document.getElementById('confirmOk').onclick = function() { done(true); };
					document.getElementById('confirmCancel').onclick = function() { done(false); };
					ov.onclick = function(e) { if (e.target === ov) done(false); };
				});
			}

			function formatTime(ts) {
				var d = new Date(ts);
				function p(n) { return (n < 10 ? '0' : '') + n; }
				return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
			}

			function esc(s) {
				return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
			}

			function toast(msg, isErr) {
				var t = document.getElementById('toast');
				t.textContent = msg;
				t.className = 'toast show' + (isErr ? ' err' : '');
				clearTimeout(t._t);
				t._t = setTimeout(function() { t.classList.remove('show'); }, 2500);
			}

			(function() {
				var body = document.body;
				var btn = document.getElementById('themeBtn');
				var saved = localStorage.getItem('tsb_theme');
				if (saved === 'light') body.classList.add('light');
				btn.addEventListener('click', function() {
					body.classList.toggle('light');
					localStorage.setItem('tsb_theme', body.classList.contains('light') ? 'light' : 'dark');
				});
			})();

			// ===== Page Transition =====
			(function() {
				var page = document.getElementById('page');
				if (!page) return;
				document.addEventListener('click', function(e) {
					var a = e.target.closest('a');
					if (!a) return;
					var href = a.getAttribute('href');
					if (!href || href.startsWith('http') || href.startsWith('#') || href.startsWith('javascript:'))
						return;
					if (a.hasAttribute('target') || e.ctrlKey || e.metaKey || e.button !== 0) return;
					e.preventDefault();
					page.classList.add('page-out');
					setTimeout(function() { window.location.href = href; }, 200);
				});
			})();
		</script>
	</body>
</html>
