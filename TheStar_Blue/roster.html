<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TheStar_Blue - 角色</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; overflow: hidden; }

:root {
  --bg: #000;
  --text: #e8eaed;
  --card-bg: rgba(255,255,255,0.05);
  --card-border: rgba(255,255,255,0.08);
  --card-shadow: 0 4px 20px rgba(0,0,0,0.3);
  --card-hover-shadow: 0 12px 36px rgba(0,0,0,0.4);
  --header-text: rgba(255,255,255,0.35);
  --header-accent: #64b5f6;
  --img-bg: rgba(255,255,255,0.04);
  --fallback-color: rgba(255,255,255,0.15);
  --link-color: rgba(255,255,255,0.35);
  --link-hover: #64b5f6;
  --toggle-color: rgba(255,255,255,0.2);
  --toggle-hover: rgba(255,255,255,0.35);
}
body.light {
  --bg: #eef1f5;
  --text: #1a2a3a;
  --card-bg: #fff;
  --card-border: rgba(0,0,0,0.04);
  --card-shadow: 0 4px 20px rgba(0,0,0,0.08);
  --card-hover-shadow: 0 12px 36px rgba(0,0,0,0.12);
  --header-text: #8a9aaa;
  --header-accent: #2563eb;
  --img-bg: #f0f2f5;
  --fallback-color: #c0c8d0;
  --link-color: #8a9aaa;
  --link-hover: #2563eb;
  --toggle-color: rgba(0,0,0,0.2);
  --toggle-hover: rgba(0,0,0,0.35);
}

body {
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: var(--text);
  transition: background 0.4s ease, color 0.4s ease;
}

/* ===== Toggle ===== */
.theme-btn {
  position: fixed;
  top: 24px;
  right: 24px;
  z-index: 1000;
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px;
  border-radius: 50%;
  color: var(--toggle-color);
  transition: color 0.3s, transform 0.2s;
  line-height: 0;
}
.theme-btn:hover { color: var(--toggle-hover); transform: scale(1.1); }
.theme-btn:active { transform: scale(0.9); }
.theme-btn svg { width: 28px; height: 28px; display: block; }

.header {
  text-align: center;
  padding: 36px 20px 10px;
  position: relative;
  z-index: 100;
}
.header a {
  display: inline-block;
  color: var(--link-color);
  text-decoration: none;
  font-size: 0.88em;
  margin-bottom: 10px;
  transition: color 0.2s;
}
.header a:hover { color: var(--link-hover); }
.header h1 { font-size: 2em; font-weight: 700; letter-spacing: 2px; }
.header h1 span { color: var(--header-accent); }


.stage {
  position: relative;
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;
  min-height: 70vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.stack {
  position: relative;
  width: 280px;
  height: 400px;
}

.card {
  position: absolute;
  width: 220px;
  top: 50%;
  left: 50%;
  margin-left: -110px;
  margin-top: -150px;
  background: var(--card-bg);
  border-radius: 20px;
  overflow: hidden;
  cursor: pointer;
  box-shadow: var(--card-shadow);
  border: 1px solid var(--card-border);
  transform: translate(var(--ox), calc(var(--oy) + 120vh)) rotate(0deg) scale(1);
  z-index: var(--z, 1);
  will-change: transform;
  transition: transform 0.08s, box-shadow 0.08s, background 0.4s, border 0.4s;
}
.card.entering {
  transition: transform 1s cubic-bezier(0.22, 0.89, 0.35, 1.15), box-shadow 0.25s, background 0.4s, border 0.4s;
}
.card.visible {
  transform: translate(var(--ox), var(--oy)) rotate(var(--r)) scale(1);
}
.card:hover {
  box-shadow: var(--card-hover-shadow);
  transform: translate(var(--ox), calc(var(--oy) - 6px)) rotate(var(--r)) scale(1.04);
}

.card .img-wrap {
  width: 100%;
  height: 220px;
  background: var(--img-bg);
  overflow: hidden;
  transition: background 0.4s;
}
.card .img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.4s;
}
.card:hover .img-wrap img { transform: scale(1.05); }
.card .img-wrap .fallback {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.5em; color: var(--fallback-color);
}

.card-body { padding: 14px 16px 16px; }
.card-body .name {
  font-size: 1em;
  font-weight: 600;
  margin-bottom: 2px;
}
.card-body .title {
  color: var(--header-text);
  font-size: 0.78em;
  line-height: 1.4;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: color 0.4s;
}

#page {
  animation: pageIn 0.35s cubic-bezier(0.22, 0.89, 0.35, 1) both;
}
@keyframes pageIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
#page.page-out {
  transition: opacity 0.18s ease, transform 0.18s ease;
  opacity: 0;
  transform: translateY(-8px);
}

/* Footer */
.footer {
  text-align: center; padding: 30px 20px;
  color: var(--header-text); font-size: 0.8em;
  transition: color 0.4s;
}

/* Loading */
.status-msg {
  text-align: center; color: var(--header-text);
  padding: 80px 20px;
  transition: color 0.4s;
}
.status-msg h2 { font-size: 1.2em; font-weight: 500; margin-bottom: 4px; }
.status-msg p { font-size: 0.9em; }

@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  display: inline-block; width: 24px; height: 24px;
  border: 2px solid var(--card-border); border-top-color: var(--header-accent);
  border-radius: 50%; animation: spin 0.8s linear infinite;
  margin-bottom: 8px;
}

@media (max-width: 768px) {
  .header { padding: 24px 16px 6px; }
  .header h1 { font-size: 1.5em; }
  .card { width: 170px; margin-left: -85px; margin-top: -120px; }
  .card .img-wrap { height: 170px; }
  .card-body { padding: 10px 12px 12px; }
  .stack { width: 220px; height: 320px; }
  .theme-btn { top: 16px; right: 16px; }
  .theme-btn svg { width: 24px; height: 24px; }
}

@media (max-width: 400px) {
  .card { width: 150px; margin-left: -75px; margin-top: -105px; }
  .card .img-wrap { height: 150px; }
}
</style>
</head>
<body>
<div id="page">

<button class="theme-btn" id="themeBtn" aria-label="切换主题">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="5"/>
    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
  </svg>
</button>

<div class="header">
  <a href="index.html">← 返回首页</a>
  <h1><span>TheStar</span>_Blue</h1>
</div>

<div class="stage" id="stage">
  <div class="status-msg" id="loading">
    <div class="spinner"></div>
    <p>加载中...</p>
  </div>
</div>

<div class="footer">&copy; TheStar_Blue</div>

<script>
var TEXTDB_KEY = 'TheStarBlue_ProdData';

(function() {
  var stage = document.getElementById('stage');
  var loading = document.getElementById('loading');

  fetch('https://textdb.online/' + TEXTDB_KEY)
    .then(function(r) { return r.text(); })
    .then(function(text) {
      var products = [];
      if (text) {
        try { products = JSON.parse(text).rosterProducts || []; } catch(e) {}
      }
      var enabled = products.filter(function(p) { return p.enabled !== false; });

      if (enabled.length === 0) {
        loading.innerHTML = '<h2>✨ 即将登场</h2><p>敬请期待...</p>';
        return;
      }

      loading.style.display = 'none';
      var n = enabled.length;

      var stack = document.createElement('div');
      stack.className = 'stack';
      stage.appendChild(stack);

      var frag = document.createDocumentFragment();

      var vw = window.innerWidth;
      var vh = window.innerHeight;
      var headerH = 80;
      var pad = 24;
      var availW = vw - pad * 2;
      var availH = vh - headerH - pad * 2;

      var maxCardW = Math.min(220, availW * 0.35);
      var maxCardH = maxCardW * 1.35;

      var gapX = maxCardW * 0.82;
      var gapY = maxCardH * 0.82;

      var cols = Math.ceil(Math.sqrt(n * availW / availH));
      cols = Math.min(cols, Math.floor((availW - maxCardW * 0.3) / gapX) + 1);
      cols = Math.max(cols, 1);
      var rows = Math.ceil(n / cols);

      var neededH = rows * gapY + maxCardH * 0.3;
      if (neededH > availH) {
        var scale = availH / neededH;
        maxCardW = Math.min(maxCardW * scale, availW * 0.4);
        maxCardH = maxCardW * 1.35;
        var gapX = maxCardW * 0.82;
        var gapY = maxCardH * 0.82;
        cols = Math.ceil(Math.sqrt(n * availW / availH));
        cols = Math.min(cols, Math.floor((availW - maxCardW * 0.3) / gapX) + 1);
        cols = Math.max(cols, 1);
        rows = Math.ceil(n / cols);
      }

      var gridW = cols * gapX;
      var gridH = rows * gapY;
      var offX = -gridW / 2 + gapX / 2;
      var offY = -gridH / 2 + gapY / 2 + (availH - neededH > 0 ? 20 : -10);
      if (n === 1) { offX = 0; offY = 0; }

      var cardW = maxCardW + 'px';
      var imgH = (maxCardW * 0.72) + 'px';

      stack.style.width = (gridW + maxCardW * 0.5) + 'px';
      stack.style.height = (gridH + maxCardW * 0.4) + 'px';

      var styleTag = document.createElement('style');
      styleTag.textContent = '.card { width: ' + cardW + '; } .card .img-wrap { height: ' + imgH + '; }';
      document.head.appendChild(styleTag);

      enabled.forEach(function(p, i) {
        var col = i % cols;
        var row = Math.floor(i / cols);

        var bx = offX + col * gapX;
        var by = offY + row * gapY;
        var jx = (Math.random() - 0.5) * 12;
        var jy = (Math.random() - 0.5) * 12;
        var rot = (Math.random() - 0.5) * 28;

        var card = document.createElement('div');
        card.className = 'card';
        card.style.setProperty('--ox', (bx + jx) + 'px');
        card.style.setProperty('--oy', (by + jy) + 'px');
        card.style.setProperty('--r', rot + 'deg');
        card.style.setProperty('--z', i);

        var imgHtml = '';
        if (p.image) {
          imgHtml = '<div class="img-wrap"><img src="' + escAttr(p.image) + '" alt="' + escAttr(p.name) + '" loading="lazy" onerror="this.outerHTML=\'<div class=fallback>✦</div>\'"></div>';
        } else {
          imgHtml = '<div class="img-wrap"><div class="fallback">✦</div></div>';
        }

        card.innerHTML = imgHtml +
          '<div class="card-body">' +
            '<div class="name">' + esc(p.name) + '</div>' +
            (p.description ? '<div class="title">' + esc(p.description) + '</div>' : '') +
          '</div>';

        // no click action

        frag.appendChild(card);
      });

      stack.appendChild(frag);

      var cards = stack.querySelectorAll('.card');
      cards.forEach(function(c, i) {
        var delay = 200 + i * 90;
        setTimeout(function() {
          c.classList.add('entering');
          c.classList.add('visible');
          setTimeout(function() { c.classList.remove('entering'); }, 1400);
        }, delay);
      });
    })
    .catch(function() {
      loading.innerHTML = '<h2>⚠️ 加载失败</h2><p>请刷新页面重试</p>';
    });
})();

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return String(s).replace(/"/g,'&quot;').replace(/&/g,'&amp;');
}



// Theme Toggle
(function() {
  var body = document.body;
  var btn = document.getElementById('themeBtn');
  var saved = localStorage.getItem('tsb_theme');
  if (saved === 'light') body.classList.add('light');
  btn.addEventListener('click', function() {
    body.classList.toggle('light');
    localStorage.setItem('tsb_theme', body.classList.contains('light') ? 'light' : 'dark');
  });
})();

// ===== Page Transition =====
(function() {
  var page = document.getElementById('page');
  if (!page) return;
  document.addEventListener('click', function(e) {
    var a = e.target.closest('a');
    if (!a) return;
    var href = a.getAttribute('href');
    if (!href || href.startsWith('http') || href.startsWith('#') || href.startsWith('javascript:')) return;
    if (a.hasAttribute('target') || e.ctrlKey || e.metaKey || e.button !== 0) return;
    e.preventDefault();
    page.classList.add('page-out');
    setTimeout(function() { window.location.href = href; }, 200);
  });
})();
</script>
</div>
</body>
</html>
