<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>TheStar_Blue - 关于</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html,
			body {
				height: 100%;
				overflow: hidden;
			}

			:root {
				--bg: #000;
				--text: #e8eaed;
				--header-text: rgba(255, 255, 255, 0.35);
				--header-accent: #64b5f6;
				--link-color: rgba(255, 255, 255, 0.35);
				--link-hover: #64b5f6;
				--toggle-color: rgba(255, 255, 255, 0.2);
				--toggle-hover: rgba(255, 255, 255, 0.35);
				--content-max-w: 640px;
			}

			body.light {
				--bg: #eef1f5;
				--text: #1a2a3a;
				--header-text: #8a9aaa;
				--header-accent: #2563eb;
				--link-color: #8a9aaa;
				--link-hover: #2563eb;
				--toggle-color: rgba(0, 0, 0, 0.2);
				--toggle-hover: rgba(0, 0, 0, 0.35);
			}

			body {
				background: var(--bg);
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				color: var(--text);
				transition: background 0.4s ease, color 0.4s ease;
				display: flex;
				flex-direction: column;
				height: 100vh;
			}

			.theme-btn {
				position: fixed;
				top: 24px;
				right: 24px;
				z-index: 1000;
				background: none;
				border: none;
				cursor: pointer;
				padding: 8px;
				border-radius: 50%;
				color: var(--toggle-color);
				transition: color 0.3s, transform 0.2s;
				line-height: 0;
			}

			.theme-btn:hover {
				color: var(--toggle-hover);
				transform: scale(1.1);
			}

			.theme-btn:active {
				transform: scale(0.9);
			}

			.theme-btn svg {
				width: 28px;
				height: 28px;
				display: block;
			}

			.header {
				text-align: center;
				padding: 36px 20px 10px;
				position: relative;
				z-index: 100;
				flex-shrink: 0;
			}

			.header a {
				display: inline-block;
				color: var(--link-color);
				text-decoration: none;
				font-size: 0.88em;
				margin-bottom: 10px;
				transition: color 0.2s;
			}

			.header a:hover {
				color: var(--link-hover);
			}

			.header h1 {
				font-size: 2em;
				font-weight: 700;
				letter-spacing: 2px;
			}

.header h1 span { color: var(--header-accent); }

			.scroll-wrap {
				flex: 1;
				overflow-y: auto;
				-webkit-overflow-scrolling: touch;
				padding: 20px 24px 60px;
			}

			.scroll-wrap::-webkit-scrollbar {
				width: 4px;
			}

			.scroll-wrap::-webkit-scrollbar-thumb {
				background: rgba(128, 128, 128, 0.15);
				border-radius: 4px;
			}

			.content {
				max-width: var(--content-max-w);
				margin: 0 auto;
				font-size: 0.95em;
				line-height: 1.8;
			}

			.content h2 {
				font-size: 1.4em;
				font-weight: 600;
				margin: 28px 0 12px;
				letter-spacing: -0.3px;
			}

			.content h3 {
				font-size: 1.15em;
				font-weight: 600;
				margin: 22px 0 10px;
			}

			.content p {
				margin-bottom: 14px;
			}

			.content a {
				color: var(--header-accent);
				text-decoration: underline;
				text-underline-offset: 2px;
			}

			.content a:hover {
				opacity: 0.7;
			}

			.content ul,
			.content ol {
				margin: 10px 0 14px 20px;
			}

			.content li {
				margin-bottom: 4px;
			}

			.content em {
				font-style: italic;
			}

			.content strong {
				font-weight: 600;
			}

			.content hr {
				border: none;
				border-top: 1px solid var(--header-text);
				opacity: 0.15;
				margin: 28px 0;
			}

			.contact-section {
				margin-top: 48px;
				padding-top: 24px;
				border-top: 1px solid var(--header-text);
				opacity: 0.4;
				font-size: 0.85em;
				transition: border-color 0.4s, opacity 0.4s;
			}
			.contact-section h3 {
				font-size: 0.9em;
				font-weight: 600;
				margin-bottom: 8px;
				letter-spacing: 0.5px;
			}
			.contact-section p {
				margin-bottom: 4px;
				opacity: 0.7;
			}

			.content blockquote {
				border-left: 3px solid var(--header-accent);
				padding-left: 16px;
				margin: 16px 0;
				opacity: 0.7;
			}

			.status-msg {
				text-align: center;
				color: var(--header-text);
				padding: 60px 20px;
				transition: color 0.4s;
			}

			.status-msg h2 {
				font-size: 1.2em;
				font-weight: 500;
				margin-bottom: 4px;
			}

			.status-msg p {
				font-size: 0.9em;
			}

			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}

			#page {
				animation: pageIn 0.35s cubic-bezier(0.22, 0.89, 0.35, 1) both;
				display: flex;
				flex-direction: column;
				height: 100vh;
			}
			@keyframes pageIn {
				from { opacity: 0; transform: translateY(12px); }
				to { opacity: 1; transform: translateY(0); }
			}
			#page.page-out {
				transition: opacity 0.18s ease, transform 0.18s ease;
				opacity: 0;
				transform: translateY(-8px);
			}

			.spinner {
				display: inline-block;
				width: 24px;
				height: 24px;
				border: 2px solid rgba(128, 128, 128, 0.15);
				border-top-color: var(--header-accent);
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
				margin-bottom: 8px;
			}

			.footer {
				flex-shrink: 0;
				text-align: center;
				padding: 16px 20px;
				color: var(--header-text);
				font-size: 0.75em;
				transition: color 0.4s;
			}

			@media (max-width: 640px) {
				.header {
					padding: 24px 16px 6px;
				}

				.header h1 {
					font-size: 1.5em;
				}

				.scroll-wrap {
					padding: 16px 16px 50px;
				}

				.theme-btn {
					top: 16px;
					right: 16px;
				}

				.theme-btn svg {
					width: 24px;
					height: 24px;
				}
			}
		</style>
	</head>
	<body>
		<div id="page">
		<button class="theme-btn" id="themeBtn" aria-label="切换主题">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
				stroke-linejoin="round">
				<circle cx="12" cy="12" r="5" />
				<path
					d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
			</svg>
		</button>
		<div class="header">
			<a href="index.html">← 返回首页</a>
			<h1><span>TheStar</span>_Blue</h1>
		</div>
		<div class="scroll-wrap" id="scrollWrap">
			<div class="status-msg" id="loading">
				<div class="spinner"></div>
				<p>加载中...</p>
			</div>
			<div class="content" id="content" style="display:none"></div>
			<div class="content contact-section" id="contactSection"></div>
		</div>
		<div class="footer">&copy; TheStar_Blue</div>
		<script>
			var TEXTDB_KEY = 'TheStarBlue_ProdData';
			(function() {
				var content = document.getElementById('content');
				var loading = document.getElementById('loading');
				fetch('https://textdb.online/' + TEXTDB_KEY)
					.then(function(r) {
						return r.text();
					})
					.then(function(text) {
						var html = '';
						if (text) {
							try {
								var data = JSON.parse(text);
								html = data.aboutContent || '';
							} catch (e) {}
						}
						if (!html) {
							html = 'TheStar_Blue';
						}
						loading.style.display = 'none';
						content.innerHTML = html;
						content.style.display = 'block';
					})
					.catch(function() {
						loading.innerHTML = '<h2>加载失败</h2><p>请刷新页面重试</p>';
					});
			})();
			(function() {
				var body = document.body;
				var btn = document.getElementById('themeBtn');
				var saved = localStorage.getItem('tsb_theme');
				if (saved === 'light') body.classList.add('light');
				btn.addEventListener('click', function() {
					body.classList.toggle('light');
					localStorage.setItem('tsb_theme', body.classList.contains('light') ? 'light' : 'dark');
				});
			})();

			// ===== Page Transition =====
			(function() {
				var page = document.getElementById('page');
				if (!page) return;
				document.addEventListener('click', function(e) {
					var a = e.target.closest('a');
					if (!a) return;
					var href = a.getAttribute('href');
					if (!href || href.startsWith('http') || href.startsWith('#') || href.startsWith('javascript:'))
						return;
					if (a.hasAttribute('target') || e.ctrlKey || e.metaKey || e.button !== 0) return;
					e.preventDefault();
					page.classList.add('page-out');
					setTimeout(function() { window.location.href = href; }, 200);
				});
			})();
		</script>
	</div>
	</body>
</html>
