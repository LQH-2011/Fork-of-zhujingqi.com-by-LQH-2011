<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TheStar_Blue - 商店</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }

:root {
  --bg: #000;
  --text: #e8eaed;
  --card-bg: rgba(255,255,255,0.04);
  --card-border: rgba(255,255,255,0.06);
  --header-text: rgba(255,255,255,0.35);
  --header-accent: #64b5f6;
  --price-color: #64b5f6;
  --img-bg: rgba(255,255,255,0.04);
  --fallback-color: rgba(255,255,255,0.12);
  --link-color: rgba(255,255,255,0.35);
  --link-hover: #64b5f6;
  --toggle-color: rgba(255,255,255,0.2);
  --toggle-hover: rgba(255,255,255,0.35);
  --spinner-border: rgba(255,255,255,0.06);
  --brand-color: rgba(255,255,255,0.3);
  --desc-color: rgba(255,255,255,0.4);
  --modal-overlay: rgba(0,0,0,0.75);
}
body.light {
  --bg: #eef1f5;
  --text: #1a2a3a;
  --card-bg: #fff;
  --card-border: rgba(0,0,0,0.04);
  --header-text: #8a9aaa;
  --header-accent: #2563eb;
  --price-color: #2563eb;
  --img-bg: #f0f2f5;
  --fallback-color: #c0c8d0;
  --link-color: #8a9aaa;
  --link-hover: #2563eb;
  --toggle-color: rgba(0,0,0,0.2);
  --toggle-hover: rgba(0,0,0,0.35);
  --spinner-border: #e0e4e8;
  --brand-color: #8a9aaa;
  --desc-color: #6a7a8a;
  --modal-overlay: rgba(0,0,0,0.5);
}

body {
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: var(--text);
  transition: background 0.4s, color 0.4s;
}

/* ===== Toggle ===== */
.theme-btn {
  position: fixed; top: 24px; right: 24px; z-index: 1000;
  background: none; border: none; cursor: pointer; padding: 8px;
  border-radius: 50%; color: var(--toggle-color);
  transition: color 0.3s, transform 0.2s; line-height: 0;
}
.theme-btn:hover { color: var(--toggle-hover); transform: scale(1.1); }
.theme-btn:active { transform: scale(0.9); }
.theme-btn svg { width: 28px; height: 28px; display: block; }

/* ===== Header ===== */
.header {
  text-align: center;
  padding: 36px 20px 6px;
  position: relative;
  z-index: 100;
}
.header a {
  display: inline-block;
  color: var(--link-color);
  text-decoration: none;
  font-size: 0.88em;
  margin-bottom: 8px;
  transition: color 0.2s;
}
.header a:hover { color: var(--link-hover); }
.header h1 { font-size: 2em; font-weight: 700; letter-spacing: 2px; }
.header h1 span { color: var(--header-accent); }

/* ===== Masonry Grid ===== */
.scroll-wrap {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  height: calc(100vh - 120px);
  padding: 8px 16px 32px;
}
.scroll-wrap::-webkit-scrollbar { width: 4px; }
.scroll-wrap::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.1); border-radius: 4px; }

.grid {
  column-count: 3;
  column-gap: 12px;
  max-width: 820px;
  margin: 0 auto;
}

/* ===== Card ===== */
.card {
  break-inside: avoid;
  margin-bottom: 12px;
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  transition: transform 0.25s ease, opacity 0.5s ease, background 0.4s, border 0.4s;
  opacity: 0;
  transform: translateY(20px) scale(0.97);
}
.card.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
  transition: transform 0.25s ease, opacity 0.5s ease, background 0.4s, border 0.4s;
}
.card:hover {
  transform: scale(1.03);
}
.card:active {
  transform: scale(0.97);
}

.card img {
  width: 100%;
  height: auto;
  display: block;
}
.card .fallback {
  width: 100%;
  aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.4em;
  color: var(--fallback-color);
  background: var(--img-bg);
  transition: color 0.4s, background 0.4s;
}

.card-body {
  padding: 8px 10px 10px;
}
.card-body .c-name {
  font-size: 0.85em;
  font-weight: 600;
  margin-bottom: 1px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.card-body .c-price {
  font-size: 0.9em;
  font-weight: 700;
  color: var(--price-color);
  transition: color 0.4s;
}

/* ===== Status / Loading ===== */
.status-msg {
  text-align: center; color: var(--header-text);
  padding: 80px 20px;
  transition: color 0.4s;
}
.status-msg h2 { font-size: 1.2em; font-weight: 500; margin-bottom: 4px; }
.status-msg p { font-size: 0.9em; }

@keyframes spin { to { transform: rotate(360deg); } }
#page {
  animation: pageIn 0.35s cubic-bezier(0.22, 0.89, 0.35, 1) both;
}
@keyframes pageIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
#page.page-out {
  transition: opacity 0.18s ease, transform 0.18s ease;
  opacity: 0;
  transform: translateY(-8px);
}
.spinner {
  display: inline-block; width: 24px; height: 24px;
  border: 2px solid var(--spinner-border); border-top-color: var(--header-accent);
  border-radius: 50%; animation: spin 0.8s linear infinite;
  margin-bottom: 8px;
}

/* ===== Footer ===== */
.footer {
  text-align: center; padding: 20px;
  color: var(--header-text); font-size: 0.78em;
  transition: color 0.4s;
}

/* ===== Modal ===== */
.modal-overlay {
  position: fixed; inset: 0;
  background: var(--modal-overlay);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  max-width: 480px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  animation: modalIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  transition: background 0.4s, border 0.4s;
}
.modal::-webkit-scrollbar { width: 3px; }
.modal::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.15); border-radius: 4px; }
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.92) translateY(16px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal .m-img {
  width: 100%;
  display: block;
  background: var(--img-bg);
}
.modal .m-fallback {
  width: 100%;
  aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 3em; color: var(--fallback-color);
  background: var(--img-bg);
}

.modal-body { padding: 20px 24px 24px; }
.modal-body .m-brand {
  font-size: 0.78em; color: var(--brand-color); margin-bottom: 4px;
  transition: color 0.4s;
}
.modal-body h2 { font-size: 1.3em; font-weight: 600; margin-bottom: 6px; }
.modal-body .m-desc {
  color: var(--desc-color); font-size: 0.92em; line-height: 1.7;
  margin-bottom: 16px; white-space: pre-wrap; transition: color 0.4s;
}
.modal-body .m-price {
  font-size: 1.4em; font-weight: 700; color: var(--price-color);
  margin-bottom: 20px; transition: color 0.4s;
}
.modal-body .m-contact {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 11px 32px; background: var(--header-accent); border: none;
  border-radius: 20px; color: #fff; font-size: 0.9em;
  font-weight: 600; cursor: pointer; transition: opacity 0.15s;
}
.modal-body .m-contact:hover { opacity: 0.85; }
.modal-body .m-contact:active { opacity: 0.7; }

.m-close {
  position: absolute;
  top: 12px; right: 12px;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: rgba(0,0,0,0.3);
  border: none;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
  line-height: 0;
}
.m-close:hover { background: rgba(0,0,0,0.5); }
body.light .m-close { background: rgba(0,0,0,0.08); color: #333; }
body.light .m-close:hover { background: rgba(0,0,0,0.15); }

/* ===== Immersive Image Viewer ===== */
.img-viewer {
  position: fixed; inset: 0;
  background: #000;
  z-index: 3000;
  display: none;
  overflow: hidden;
  cursor: grab;
}
.img-viewer.open { display: block; }

.img-viewer .close-btn {
  position: fixed;
  top: 20px; right: 20px;
  z-index: 10;
  background: rgba(255,255,255,0.06);
  border: none;
  color: rgba(255,255,255,0.4);
  width: 40px; height: 40px;
  border-radius: 50%;
  font-size: 24px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s, color 0.2s, transform 0.2s;
  line-height: 1;
}
.img-viewer .close-btn:hover {
  background: rgba(255,255,255,0.12);
  color: #fff;
  transform: scale(1.1);
}

.img-viewer .caption {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 40px 24px 24px;
  background: linear-gradient(transparent, rgba(0,0,0,0.6));
  color: #fff;
  z-index: 10;
  pointer-events: none;
}
.img-viewer .caption h2 { font-size: 1.1em; font-weight: 600; }
.img-viewer .caption p { font-size: 0.82em; opacity: 0.6; margin-top: 2px; }

.img-viewer .img-stage {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.img-viewer .img-stage img {
  display: block;
  max-width: 100vw;
  max-height: 100vh;
  object-fit: contain;
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  will-change: transform;
  user-select: none;
  -webkit-user-drag: none;
  cursor: grab;
}
.img-viewer .img-stage img.zoomed {
  max-width: none;
  max-height: none;
  cursor: grab;
}
.img-viewer .img-stage img.grabbing { cursor: grabbing; }

@media (max-width: 768px) {
  .grid { column-count: 2; column-gap: 10px; }
  .card { margin-bottom: 10px; border-radius: 14px; }
}
@media (max-width: 480px) {
  .grid { column-count: 2; column-gap: 8px; }
  .card { margin-bottom: 8px; border-radius: 12px; }
}
@media (max-width: 640px) {
  .header { padding: 24px 16px 4px; }
  .header h1 { font-size: 1.5em; }
  .scroll-wrap { padding: 6px 12px 24px; height: calc(100vh - 96px); }
  .theme-btn { top: 16px; right: 16px; }
  .theme-btn svg { width: 24px; height: 24px; }
  .modal-body { padding: 16px 18px 20px; }
}
</style>
</head>
<body>
<div id="page">

<button class="theme-btn" id="themeBtn" aria-label="切换主题">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="5"/>
    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
  </svg>
</button>

<div class="header">
  <a href="index.html">← 返回首页</a>
  <h1><span>TheStar</span>_Blue</h1>
</div>

<div class="scroll-wrap" id="scrollWrap">
  <div class="status-msg" id="loading">
    <div class="spinner"></div>
    <p>加载中...</p>
  </div>
</div>

<div class="footer">&copy; TheStar_Blue</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox" onclick="if(event.target===this)closeModal()">
    <button class="m-close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<div class="img-viewer" id="imgViewer">
  <button class="close-btn" id="viewerClose">&times;</button>
  <div class="caption">
    <h2 id="viewerName"></h2>
    <p id="viewerDesc"></p>
  </div>
  <div class="img-stage" id="imgStage">
    <img src="" alt="" id="viewerImg" draggable="false">
  </div>
</div>

<script>
var TEXTDB_KEY = 'TheStarBlue_ProdData';

(function() {
  var wrap = document.getElementById('scrollWrap');
  var loading = document.getElementById('loading');

  fetch('https://textdb.online/' + TEXTDB_KEY)
    .then(function(r) { return r.text(); })
    .then(function(text) {
      var products = [];
      if (text) {
        try { var data = JSON.parse(text); products = data.shopProducts || []; } catch(e) {}
      }
      var enabled = products.filter(function(p) { return p.enabled !== false; });

      if (enabled.length === 0) {
        loading.innerHTML = '<h2>✨ 商品即将上架</h2><p>敬请期待...</p>';
        return;
      }

      loading.style.display = 'none';
      var grid = document.createElement('div');
      grid.className = 'grid';
      wrap.appendChild(grid);

      var frag = document.createDocumentFragment();

      enabled.forEach(function(p) {
        var card = document.createElement('div');
        card.className = 'card';

        var imgHtml = p.image
          ? '<img src="' + p.image.replace(/"/g,'&quot;') + '" alt="' + esc(p.name) + '" loading="lazy" onerror="this.outerHTML=\'<div class=fallback>✦</div>\'">'
          : '<div class="fallback">✦</div>';

        card.innerHTML = imgHtml +
          '<div class="card-body">' +
            '<div class="c-name">' + esc(p.name) + '</div>' +
            (p.price ? '<div class="c-price">' + esc(p.price) + '</div>' : '') +
          '</div>';

        card.addEventListener('click', (function(product) {
          return function() { openModal(product); };
        })(p));

        frag.appendChild(card);
      });

      grid.appendChild(frag);

      var cards = grid.querySelectorAll('.card');
      var obs = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            obs.unobserve(entry.target);
          }
        });
      }, { threshold: 0.05 });

      cards.forEach(function(c) { obs.observe(c); });
    })
    .catch(function() {
      loading.innerHTML = '<h2>⚠️ 加载失败</h2><p>请刷新页面重试</p>';
    });
})();

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ===== Modal =====
var modalOv = document.getElementById('modalOverlay');
var modalContent = document.getElementById('modalContent');
var currentProduct = null;

function openModal(product) {
  currentProduct = product;
  var hasImg = !!product.image;
  var imgHtml = product.image
    ? '<img class="m-img" src="' + product.image.replace(/"/g,'&quot;') + '" alt="' + esc(product.name) + '" onerror="this.outerHTML=\'<div class=m-fallback>✦</div>\'" style="cursor:zoom-in">'
    : '<div class="m-fallback">✦</div>';

  modalContent.innerHTML = imgHtml +
    '<div class="modal-body">' +
      '<div class="m-brand">TheStar_Blue</div>' +
      '<h2>' + esc(product.name) + '</h2>' +
      (product.description ? '<div class="m-desc">' + esc(product.description) + '</div>' : '') +
      (product.price ? '<div class="m-price">' + esc(product.price) + '</div>' : '') +
      '<button class="m-contact" onclick="closeModal();location.href=\'about.html\'">联系购买</button>' +
    '</div>';

  // Click modal image to open immersive viewer
  if (hasImg) {
    var mImg = modalContent.querySelector('.m-img');
    if (mImg) mImg.addEventListener('click', function() { openImage(currentProduct); });
  }

  modalOv.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  modalOv.classList.remove('open');
  document.body.style.overflow = '';
}

modalOv.addEventListener('click', function(e) {
  if (e.target === modalOv) closeModal();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

// Theme Toggle
(function() {
  var body = document.body;
  var btn = document.getElementById('themeBtn');
  var saved = localStorage.getItem('tsb_theme');
  if (saved === 'light') body.classList.add('light');
  btn.addEventListener('click', function() {
    body.classList.toggle('light');
    localStorage.setItem('tsb_theme', body.classList.contains('light') ? 'light' : 'dark');
  });
})();

// ===== Page Transition =====
(function() {
  var page = document.getElementById('page');
  if (!page) return;
  document.addEventListener('click', function(e) {
    var a = e.target.closest('a');
    if (!a) return;
    var href = a.getAttribute('href');
    if (!href || href.startsWith('http') || href.startsWith('#') || href.startsWith('javascript:')) return;
    if (a.hasAttribute('target') || e.ctrlKey || e.metaKey || e.button !== 0) return;
    e.preventDefault();
    page.classList.add('page-out');
    setTimeout(function() { window.location.href = href; }, 200);
  });
})();

// ===== Immersive Image Viewer =====
var viewer = document.getElementById('imgViewer');
var viewerImg = document.getElementById('viewerImg');
var viewerName = document.getElementById('viewerName');
var viewerDesc = document.getElementById('viewerDesc');
var viewerClose = document.getElementById('viewerClose');
var imgStage = document.getElementById('imgStage');

var vScale = 1, vTx = 0, vTy = 0;
var isPanning = false, startX, startY, startTx, startTy;
var zoomed = false;

function resetViewer() {
  vScale = 1; vTx = 0; vTy = 0; zoomed = false;
  viewerImg.className = '';
  viewerImg.style.transform = '';
}

function openImage(product) {
  if (!product.image) return;
  resetViewer();
  viewerImg.src = product.image;
  viewerImg.alt = product.name || '';
  viewerName.textContent = product.name || '';
  viewerDesc.textContent = product.description || (product.price || '');
  viewer.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeViewer() {
  viewer.classList.remove('open');
  document.body.style.overflow = '';
  resetViewer();
}

function applyVTransform() {
  viewerImg.style.transform = 'translate(' + vTx + 'px, ' + vTy + 'px) scale(' + vScale + ')';
}

function zoomAt(wheelDelta, clientX, clientY) {
  var rect = viewerImg.getBoundingClientRect();
  var cx = (clientX - rect.left) / rect.width;
  var cy = (clientY - rect.top) / rect.height;
  var oldScale = vScale;
  vScale *= (1 - wheelDelta * 0.002);
  vScale = Math.min(Math.max(vScale, 0.5), 8);
  zoomed = vScale > 1.2;
  viewerImg.className = zoomed ? 'zoomed' : '';
  applyVTransform();
}

viewerImg.addEventListener('wheel', function(e) {
  e.preventDefault();
  zoomAt(e.deltaY, e.clientX, e.clientY);
}, { passive: false });

viewerImg.addEventListener('mousedown', function(e) {
  isPanning = true;
  startX = e.clientX;
  startY = e.clientY;
  startTx = vTx;
  startTy = vTy;
  viewerImg.classList.add('grabbing');
});
document.addEventListener('mousemove', function(e) {
  if (!isPanning) return;
  var dx = e.clientX - startX;
  var dy = e.clientY - startY;
  vTx = startTx + dx;
  vTy = startTy + dy;
  viewerImg.style.transform = 'translate(' + vTx + 'px, ' + vTy + 'px) scale(' + vScale + ')';
});
document.addEventListener('mouseup', function() {
  if (!isPanning) return;
  isPanning = false;
  viewerImg.classList.remove('grabbing');
});

imgStage.addEventListener('click', function(e) {
  if (e.target === imgStage) closeViewer();
});

viewerClose.addEventListener('click', closeViewer);
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeViewer();
});

// Touch support
var lastDist = 0;
viewerImg.addEventListener('touchstart', function(e) {
  if (e.touches.length === 1) {
    isPanning = true;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startTx = vTx;
    startTy = vTy;
  } else if (e.touches.length === 2) {
    isPanning = false;
    var t = e.touches;
    lastDist = Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  }
});
viewerImg.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (e.touches.length === 1 && isPanning) {
    vTx = startTx + (e.touches[0].clientX - startX);
    vTy = startTy + (e.touches[0].clientY - startY);
    viewerImg.style.transform = 'translate(' + vTx + 'px, ' + vTy + 'px) scale(' + vScale + ')';
  } else if (e.touches.length === 2) {
    var t = e.touches;
    var dist = Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    if (lastDist > 0) {
      vScale *= dist / lastDist;
      vScale = Math.min(Math.max(vScale, 0.5), 8);
      zoomed = vScale > 1.2;
      viewerImg.className = zoomed ? 'zoomed' : '';
      applyVTransform();
    }
    lastDist = dist;
  }
}, { passive: false });
viewerImg.addEventListener('touchend', function() {
  isPanning = false;
  lastDist = 0;
});
</script>
</div>
</body>
</html>
