<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TheStar_Blue</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html,
		body {
			height: 100%;
			overflow: hidden;
		}

		:root {
			--bg: #f2ece2;
			--text: #2a2a3a;
			--title-color: #1e1e2e;
			--title-accent: #4a90c0;
			--sky-top: #e8e2d8;
			--sky-bot: #f0ece4;
			--btn-text: rgba(40,40,60,0.35);
			--btn-border: rgba(40,40,60,0.06);
			--btn-hover-bg: rgba(40,40,60,0.03);
			--btn-hover-border: rgba(74,144,192,0.15);
			--pri-bg: rgba(74,144,192,0.06);
			--pri-border: rgba(74,144,192,0.1);
			--pri-text: #3a80b0;
			--pri-hover-bg: rgba(74,144,192,0.1);
			--pri-hover-border: rgba(74,144,192,0.18);
			--toggle-color: rgba(40,40,60,0.12);
			--toggle-hover: rgba(40,40,60,0.25);
			--star-glow-1: rgba(74,144,192,0.15);
			--star-glow-2: rgba(74,144,192,0.04);
			--star-ray: rgba(74,144,192,0.15);
		}

		body.dark {
			--bg: #0a0a0e;
			--text: #c0c0c0;
			--title-color: #d8d8d8;
			--title-accent: #5a9ec0;
			--sky-top: #08080c;
			--sky-bot: #0e0e14;
			--btn-text: rgba(200,200,200,0.25);
			--btn-border: rgba(200,200,200,0.04);
			--btn-hover-bg: rgba(200,200,200,0.03);
			--btn-hover-border: rgba(90,158,192,0.12);
			--pri-bg: rgba(90,158,192,0.05);
			--pri-border: rgba(90,158,192,0.08);
			--pri-text: #70b0d0;
			--pri-hover-bg: rgba(90,158,192,0.08);
			--pri-hover-border: rgba(90,158,192,0.15);
			--toggle-color: rgba(200,200,200,0.08);
			--toggle-hover: rgba(200,200,200,0.18);
			--star-glow-1: rgba(90,158,192,0.12);
			--star-glow-2: rgba(90,158,192,0.03);
			--star-ray: rgba(90,158,192,0.08);
		}

		body {
			background: var(--bg);
			font-family: -apple-system, 'Helvetica Neue', 'SF Pro Display', sans-serif;
			display: flex;
			align-items: center;
			justify-content: center;
			user-select: none;
			color: var(--text);
			-webkit-font-smoothing: antialiased;
			transition: background 0.4s ease, color 0.4s ease;
		}

		/* ===== Theme Toggle ===== */
		.theme-btn {
			position: fixed;
			top: 24px;
			right: 24px;
			z-index: 100;
			background: none;
			border: none;
			cursor: pointer;
			padding: 8px;
			border-radius: 50%;
			color: var(--toggle-color);
			transition: color 0.3s, transform 0.2s;
			line-height: 0;
		}

		.theme-btn:hover {
			color: var(--toggle-hover);
			transform: scale(1.1);
		}

		.theme-btn:active {
			transform: scale(0.9);
		}

		.theme-btn svg {
			width: 28px;
			height: 28px;
			display: block;
		}

		/* ===== Scene ===== */
		.scene {
			position: fixed;
			inset: 0;
			z-index: 0;
			pointer-events: none;
			overflow: hidden;
		}

		.sky {
			position: absolute;
			inset: 0;
			background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 100%);
			transition: background 0.4s ease;
		}

		.layer {
			position: absolute;
			inset: 0;
			will-change: transform;
		}

		.mtn-wrap {
			position: absolute;
			bottom: 0;
			left: 0;
			right: 0;
			height: 100%;
		}

		.mtn-wrap svg {
			display: block;
			width: 100%;
			height: 100%;
			overflow: visible;
		}

		/* ===== Blue Star ===== */
		.big-star {
			position: absolute;
			top: 16%;
			left: 56%;
			width: 90px;
			height: 90px;
			pointer-events: none;
		}

		.big-star .core {
			position: absolute;
			top: 50%;
			left: 50%;
			width: 28px;
			height: 28px;
			margin: -14px 0 0 -14px;
			background: radial-gradient(circle, #90caf9, #5ab0d0 50%, #3a90b0);
			border-radius: 50%;
			box-shadow: 0 0 80px var(--star-glow-1), 0 0 160px var(--star-glow-2);
			animation: breathe 3.5s ease-in-out infinite;
		}

		@keyframes breathe {
			0%, 100% {
				box-shadow: 0 0 40px rgba(74,144,192,0.12), 0 0 80px rgba(74,144,192,0.03);
				transform: scale(0.92);
			}
			50% {
				box-shadow: 0 0 100px rgba(74,144,192,0.35), 0 0 200px rgba(74,144,192,0.1);
				transform: scale(1.08);
			}
		}

		.big-star .ray {
			position: absolute;
			top: 50%;
			left: 50%;
			width: 2.5px;
			height: 40px;
			margin: -20px 0 0 -1.25px;
			background: linear-gradient(to top, var(--star-ray), transparent);
			border-radius: 2px;
			animation: rayPulse 6s ease-in-out infinite;
		}

		.big-star .r2 { transform: rotate(45deg); animation-delay: -1.5s; }
		.big-star .r3 { transform: rotate(90deg); animation-delay: -3s; }
		.big-star .r4 { transform: rotate(135deg); animation-delay: -4.5s; }
		.big-star .r5 { transform: rotate(22.5deg); width: 2px; height: 28px; margin-top: -14px; animation-delay: -0.75s; }
		.big-star .r6 { transform: rotate(67.5deg); width: 2px; height: 28px; margin-top: -14px; animation-delay: -2.25s; }
		.big-star .r7 { transform: rotate(112.5deg); width: 2px; height: 28px; margin-top: -14px; animation-delay: -3.75s; }
		.big-star .r8 { transform: rotate(157.5deg); width: 2px; height: 28px; margin-top: -14px; animation-delay: -5.25s; }

		@keyframes rayPulse {
			0%, 100% { opacity: 0.25 }
			50% { opacity: 0.7 }
		}

		/* ===== Content ===== */
		#page {
			position: relative;
			z-index: 1;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			padding: 40px 32px;
			animation: pageIn .35s cubic-bezier(.22,.89,.35,1) both;
		}

		@keyframes pageIn {
			from { opacity: 0; transform: translateY(12px) }
			to { opacity: 1; transform: translateY(0) }
		}

		#page.page-out {
			transition: opacity .18s ease, transform .18s ease;
			opacity: 0;
			transform: translateY(-8px);
		}

		.title {
			font-size: 4em;
			font-weight: 700;
			letter-spacing: -1px;
			line-height: 1.05;
			color: var(--title-color);
			transition: color 0.4s ease;
		}

		.title span {
			color: var(--title-accent);
		}

		.btns {
			margin-top: 52px;
			display: flex;
			flex-direction: column;
			gap: 14px;
			align-items: center;
		}

		.btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 10px;
			padding: 16px 48px;
			border-radius: 50px;
			font-size: 1.05em;
			font-weight: 500;
			text-decoration: none;
			cursor: pointer;
			transition: all 0.2s ease;
			letter-spacing: 0.5px;
			min-width: 260px;
			border: 1.5px solid var(--btn-border);
			color: var(--btn-text);
			background: transparent;
		}

		.btn:hover {
			background: var(--btn-hover-bg);
			border-color: var(--btn-hover-border);
			color: var(--text);
		}

		.btn:active {
			transform: scale(0.97);
		}

		.btn-pri {
			background: var(--pri-bg);
			border-color: var(--pri-border);
			color: var(--pri-text);
		}

		.btn-pri:hover {
			background: var(--pri-hover-bg);
			border-color: var(--pri-hover-border);
			color: var(--text);
		}

		.btn .arrow {
			opacity: 0.3;
			transition: transform 0.2s, opacity 0.2s;
		}

		.btn:hover .arrow {
			transform: translateX(4px);
			opacity: 0.6;
		}

		.foot {
			position: fixed;
			bottom: 14px;
			left: 0;
			right: 0;
			text-align: center;
			font-size: 0.65em;
			letter-spacing: 0.5px;
			z-index: 1;
			transition: color 0.4s;
		}

		.foot a {
			color: rgba(60,60,60,0.15);
			text-decoration: none;
			transition: color 0.3s;
		}

		.foot a:hover {
			color: rgba(60,60,60,0.35);
		}

		body.dark .foot a {
			color: rgba(255,255,255,0.08);
		}

		body.dark .foot a:hover {
			color: rgba(255,255,255,0.2);
		}

		/* ===== Visit Counter ===== */
		.vcount {
			position: absolute;
			bottom: 12%;
			right: 5%;
			z-index: 1;
			font-size: 0.9em;
			letter-spacing: 0.3px;
			color: rgba(40,40,60,0.25);
			pointer-events: none;
			font-variant-numeric: tabular-nums;
			transition: color 0.4s;
			font-weight: 300;
		}

		body.dark .vcount {
			color: rgba(200,200,200,0.06);
		}

		@media (max-width: 640px) {
			.title {
				font-size: 2.4em;
			}
			.btn {
				padding: 14px 32px;
				font-size: 0.95em;
				min-width: 200px;
			}
			#page {
				padding: 24px 20px;
			}
			.btns {
				margin-top: 36px;
				gap: 12px;
			}
			.big-star {
				width: 60px;
				height: 60px;
				top: 12%;
				left: 58%;
			}
			.big-star .core {
				width: 20px;
				height: 20px;
				margin: -10px 0 0 -10px;
			}
			.big-star .ray {
				height: 28px;
				margin-top: -14px;
			}
			.big-star .r5, .big-star .r6, .big-star .r7, .big-star .r8 {
				height: 20px;
				margin-top: -10px;
			}
			.theme-btn {
				top: 16px;
				right: 16px;
			}
			.theme-btn svg {
				width: 24px;
				height: 24px;
			}
		}
	</style>
</head>
<body>

<button class="theme-btn" id="themeBtn" aria-label="切换主题">
	<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
		<circle cx="12" cy="12" r="5"/>
		<path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
	</svg>
</button>

<div class="scene">
	<div class="sky"></div>
	<div id="bigStarLayer" class="layer">
		<div class="big-star">
			<div class="core"></div>
			<div class="ray r1"></div>
			<div class="ray r2"></div>
			<div class="ray r3"></div>
			<div class="ray r4"></div>
			<div class="ray r5"></div>
			<div class="ray r6"></div>
			<div class="ray r7"></div>
			<div class="ray r8"></div>
		</div>
	</div>
	<div id="mtnContainer"></div>
	<div class="vcount" id="vcount"></div>
</div>

<div id="page">
	<div class="title"><span>TheStar</span>_Blue</div>
	<div class="btns">
		<a href="roster.html" class="btn btn-pri">角色一览 <span class="arrow">→</span></a>
		<a href="shop.html" class="btn">进店选购 <span class="arrow">→</span></a>
		<a href="about.html" class="btn">关于 <span class="arrow">→</span></a>
		<a href="comments.html" class="btn">评论区 <span class="arrow">→</span></a>
	</div>
	</div>

	<div class="foot"><a href="#">TheStar_Blue</a> · <a href="https://zhujingqi.com/">Zhujingqi</a></div>

	<script>
	(function() {
		// ===== Morandi mountain landscape =====
		var mtnLayers = [{
			peaks: [
				{x: 80, w: 120, h: 20},
				{x: 340, w: 140, h: 28},
				{x: 640, w: 130, h: 24},
				{x: 960, w: 140, h: 30},
				{x: 1280, w: 120, h: 22},
				{x: 1520, w: 100, h: 18}
			],
			baseY: 22,
			fill: 'rgba(200,195,185,0.08)'
		}, {
			peaks: [
				{x: 140, w: 180, h: 35},
				{x: 520, w: 200, h: 42},
				{x: 900, w: 180, h: 38},
				{x: 1260, w: 160, h: 32}
			],
			baseY: 80,
			fill: 'rgba(190,190,178,0.14)'
		}, {
			peaks: [
				{x: 100, w: 240, h: 55},
				{x: 600, w: 260, h: 68},
				{x: 1100, w: 220, h: 50}
			],
			baseY: 155,
			fill: 'rgba(178,185,172,0.22)'
		}, {
			peaks: [
				{x: 180, w: 320, h: 85},
				{x: 740, w: 340, h: 105},
				{x: 1300, w: 280, h: 78}
			],
			baseY: 250,
			fill: 'rgba(165,180,170,0.30)'
		}, {
			peaks: [
				{x: 120, w: 400, h: 135},
				{x: 820, w: 440, h: 160},
				{x: 1480, w: 360, h: 115}
			],
			baseY: 355,
			fill: 'rgba(150,175,165,0.40)'
		}, {
			peaks: [
				{x: 280, w: 560, h: 190},
				{x: 1120, w: 600, h: 210}
			],
			baseY: 460,
			fill: 'rgba(135,168,158,0.52)'
		}];

		// Dark mode fills - very muted, dark
		var darkFills = [
			'rgba(60,80,100,0.04)',
			'rgba(50,70,90,0.07)',
			'rgba(40,60,80,0.11)',
			'rgba(35,55,75,0.16)',
			'rgba(30,50,70,0.22)',
			'rgba(25,45,65,0.30)'
		];

		var container = document.getElementById('mtnContainer');
		var viewW = 1600, viewH = 600;

		mtnLayers.forEach(function(layer) {
			var div = document.createElement('div');
			div.className = 'layer';
			div.id = 'ml' + (mtnLayers.indexOf(layer) + 1);

			var wrap = document.createElement('div');
			wrap.className = 'mtn-wrap';

			var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
			svg.setAttribute('viewBox', '0 0 ' + viewW + ' ' + viewH);
			svg.setAttribute('preserveAspectRatio', 'none');

			var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
			path.setAttribute('fill', layer.fill);

			var b = layer.baseY;
			var pts = ['M0,' + b];
			layer.peaks.forEach(function(p) {
				var hw = p.w / 2;
				pts.push('L' + (p.x - hw) + ',' + b);
				pts.push('L' + p.x + ',' + (b - p.h));
				pts.push('L' + (p.x + hw) + ',' + b);
			});
			pts.push('L' + viewW + ',' + b + ' L' + viewW + ',' + viewH + ' L0,' + viewH + ' Z');
			path.setAttribute('d', pts.join(' '));

			svg.appendChild(path);
			wrap.appendChild(svg);
			div.appendChild(wrap);
			container.appendChild(div);
		});

		// ===== Theme toggle =====
		var body = document.body;
		var btn = document.getElementById('themeBtn');

		function updateMtnColors(isDark) {
			var paths = container.querySelectorAll('path');
			paths.forEach(function(p, i) {
				p.setAttribute('fill', isDark ? (darkFills[i] || darkFills[darkFills.length - 1]) : mtnLayers[i].fill);
			});
		}

		var saved = localStorage.getItem('tsb_theme');
		if (saved === 'dark') {
			body.classList.add('dark');
			updateMtnColors(true);
		}

		btn.addEventListener('click', function() {
			var isDark = body.classList.toggle('dark');
			localStorage.setItem('tsb_theme', isDark ? 'dark' : 'light');
			updateMtnColors(isDark);
		});

		// ===== Parallax =====
		var elList = [];
		for (var mi = 1; mi <= mtnLayers.length; mi++) {
			var el = document.getElementById('ml' + mi);
			if (el) elList.push(el);
		}
		var starEl = document.getElementById('bigStarLayer');
		if (starEl) elList.push(starEl);

		var strengths = [];
		for (var i = 0; i < mtnLayers.length; i++) {
			var t = (i + 1) / mtnLayers.length;
			strengths.push({x: 1.5 + t * 10, y: 0.5 + t * 4});
		}
		strengths.push({x: 8, y: 5});

		function apply(mx, my) {
			for (var i = 0; i < elList.length; i++) {
				elList[i].style.transform = 'translate(' + (mx * strengths[i].x) + 'px,' + (my * strengths[i].y) + 'px)';
			}
		}

		var frame;
		document.addEventListener('mousemove', function(e) {
			if (frame) cancelAnimationFrame(frame);
			frame = requestAnimationFrame(function() {
				apply(
					(e.clientX / window.innerWidth - 0.5) * 2,
					(e.clientY / window.innerHeight - 0.5) * 2
				);
			});
		});

		document.addEventListener('mouseleave', function() {
			elList.forEach(function(el) {
				el.style.transform = 'translate(0,0)';
			});
		});

		// ===== Page Transition =====
		var page = document.getElementById('page');
		document.addEventListener('click', function(e) {
			var a = e.target.closest('a');
			if (!a) return;
			var href = a.getAttribute('href');
			if (!href || href.startsWith('http') || href.startsWith('#') || href.startsWith('javascript:')) return;
			if (a.hasAttribute('target') || e.ctrlKey || e.metaKey || e.button !== 0) return;
			e.preventDefault();
			page.classList.add('page-out');
			setTimeout(function() { window.location.href = href; }, 200);
		});

		// ===== Visit Counter =====
		var COUNT_KEY = 'TheStarBlue_VisitCount';
		var vEl = document.getElementById('vcount');

		fetch('https://textdb.online/' + COUNT_KEY)
			.then(function(r) { return r.text(); })
			.then(function(text) {
				var count = parseInt(text, 10) || 0;
				count++;
				vEl.textContent = '总访问量：' + count;
				fetch('https://textdb.online/update/?key=' + encodeURIComponent(COUNT_KEY) + '&value=' + encodeURIComponent(String(count)));
			})
			.catch(function() {
				vEl.textContent = '';
			});
	})();
</script>

</body>
</html>
